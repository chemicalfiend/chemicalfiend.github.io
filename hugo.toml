baseURL = "https://chemicalfiend.github.io/"
locale = "en-us"
title = "Pranay Venkatesh"
theme = "hugo-classic"
enableEmoji = true
enableRobotsTXT = true

# Old Quarto site lived at /half-baked-ideas/*.html; those URLs are deliberately
# not preserved. See CLAUDE.md.

[permalinks]
post = "/post/:year/:month/:day/:slug/"

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

# ---------------------------------------------------------------------------
# Markup: maths via Goldmark passthrough (Hugo >= 0.122), rendered by KaTeX in
# layouts/partials/foot_custom.html. Posts use plain $...$ and $$...$$.
# https://gohugo.io/content-management/mathematics/
# ---------------------------------------------------------------------------
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block  = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[markup.highlight]
codeFences = true
guessSyntax = false
lineNos = false
noClasses = false          # emit classes; colours come from static/css/chroma.css
style = "github-dark"      # regenerate: hugo gen chromastyles --style=github-dark > static/css/chroma.css
tabWidth = 4

[markup.tableOfContents]
startLevel = 2
endLevel = 3

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
[[menu.main]]
name = "posts"
url = "/post/"
weight = 1

[[menu.main]]
name = "tags"
url = "/tags/"
weight = 2

[[menu.feed]]
name = "rss"
url = "/index.xml"

# ---------------------------------------------------------------------------
# Profile — drives layouts/index.html. Edit here, never in the template.
# ---------------------------------------------------------------------------
[params]
description = "Chemical physics: quantum dynamics, transport and noise."
author = "Pranay Venkatesh"
role = "PhD student, Chemical Physics"
organization = "University of Colorado, Boulder"
avatar = "img/dp_me_w_hume.png"

# Short bio shown to the right of the portrait. Markdown is rendered.
bio = """
I am a theoretical chemist. I work on mathematical models and simulation 
techniques in an effort to guide next-generation materials design.
Specifically, I develop methods to study charge, spin and energy dynamics 
in quantum materials and condensed-phase chemical systems. 

I am particularly interested in statistical mechanics and quantum dynamics
and love using them to simulate the large soup of interacting atoms, electrons
and photons that are involved in the science of real disordered matter out of equilibrium.

Outside of research I like cooking, watching anime, hiking and playing the bass guitar.
"""

interests = [
  "Quantum Dynamics",
  "Condensed Matter Physics",
  "Optoelectronics",
  "Nanomaterials"
]

