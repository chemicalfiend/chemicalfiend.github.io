I am a PhD student at the University of Colorado, Boulder, working on theoretical
methods for charge, spin and energy transfer dynamics in molecular and solid-state
systems. Before this I read Chemistry and Chemical Engineering at BITS Pilani, and
wrote my master's thesis at Imperial College London.

Outside of research I like anime, hiking and strange metal music.
"""

